<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>삼봉 FC: 얼티밋 라커룸 (확정판)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pitch-green: #0a1912; --fut-gold: #e8c271; --fut-rare: #38ff8e; }
        body { background: var(--pitch-green); color: #f8fafc; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #15452d, #0a1912); }
        .font-display { font-family: 'Black Han Sans', sans-serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .glass { background: rgba(17, 41, 29, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(232, 194, 113, 0.2); }
        
        /* FUT CARD UI */
        .fut-card { clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%); position: relative; transition: transform 0.3s; }
        .card-rookie { background: linear-gradient(135deg, #d4af37, #cd7f32); }
        .card-semipro { background: linear-gradient(135deg, #e2e2e2, #999999); color: #111; }
        .card-pro { background: linear-gradient(135deg, #fceda1, #e8c271, #b08d41); color: #332305; }
        .card-worldclass { background: linear-gradient(135deg, #9370db, #4b0082); box-shadow: 0 0 20px rgba(138,43,226,0.6); }
        .card-challenger { background: linear-gradient(135deg, #222, #111); border: 2px solid gold; animation: rainbow-glow 3s infinite; }
        @keyframes rainbow-glow { 0% { box-shadow: 0 0 15px red; } 33% { box-shadow: 0 0 15px green; } 66% { box-shadow: 0 0 15px blue; } 100% { box-shadow: 0 0 15px red; } }

        .item-slot { width: 38px; height: 38px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: absolute; z-index: 20; }
        .eff-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 2px white); } 50% { filter: drop-shadow(0 0 8px var(--fut-rare)); } }
        
        .nav-tab.active { color: var(--fut-rare); border-bottom: 3px solid var(--fut-rare); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .mini-card { transition: all 0.2s; border: 2px solid #1f422e; opacity: 0.6; }
        .mini-card.active { opacity: 1; border-color: #38ff8e; }
        .mini-card.selected { border-color: var(--fut-gold); box-shadow: 0 0 15px rgba(232,194,113,0.5); transform: translateY(-3px); }
        
        .loader { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: var(--fut-rare); border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- 전역 로딩 -->
    <div id="globalLoading" class="fixed inset-0 z-[1000] bg-black/90 flex flex-col items-center justify-center hidden">
        <div class="loader mb-4"></div>
        <p class="font-display text-xl text-white tracking-widest">통신 중...</p>
    </div>

    <!-- 로그인 오버레이 -->
    <div id="loginOverlay" class="fixed inset-0 z-[500] bg-pitch-green flex flex-col items-center justify-center px-4 transition-opacity duration-500">
        <div class="text-center mb-10">
            <i class="fa-solid fa-shield-halved text-6xl text-fut-rare mb-4"></i>
            <h1 class="text-5xl font-display text-white tracking-widest">SAMBONG FC</h1>
            <p class="text-emerald-400 mt-2 font-bold uppercase tracking-tighter">Ultimate Locker Room v2.1</p>
        </div>
        <div class="glass p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <select id="loginId" class="w-full bg-slate-800 border border-slate-600 text-white rounded-xl px-4 py-3 font-bold mb-4 outline-none">
                <option value="" disabled selected>입장 자격 선택</option>
                <option value="guest">👀 게스트 (둘러보기)</option>
                <option value="player">👤 삼봉 FC 선수</option>
                <option value="gm1">👑 마스터 (선생님)</option>
            </select>
            <div id="playerNameContainer" class="hidden mb-4">
                <select id="loginName" class="w-full bg-slate-800 border border-emerald-600 text-white rounded-xl px-4 py-3 font-bold outline-none"></select>
            </div>
            <input type="password" id="loginPin" placeholder="PIN 4자리" class="w-full bg-slate-800 border border-slate-600 text-white rounded-xl px-4 py-3 text-center tracking-[0.5em] mb-6 outline-none">
            <button id="btnLogin" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105">라커룸 입장</button>
        </div>
    </div>

    <!-- 네비게이션 -->
    <nav class="sticky top-0 z-[100] bg-pitch-green/95 border-b border-emerald-900/50 p-4 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="font-display text-xl text-white">SAMBONG FC</div>
            <div class="flex gap-4 overflow-x-auto hide-scrollbar whitespace-nowrap px-4">
                <button onclick="window.setTab('locker')" class="nav-tab active px-2 py-1 font-bold">라커룸</button>
                <button onclick="window.setTab('shop')" class="nav-tab px-2 py-1 font-bold">상점/강화</button>
                <button onclick="window.setTab('rank')" class="nav-tab px-2 py-1 font-bold">랭킹</button>
                <button id="adminTab" onclick="window.setTab('admin')" class="nav-tab px-2 py-1 font-bold hidden">관리자</button>
            </div>
            <div class="flex items-center gap-3">
                <span id="navInfo" class="text-xs font-bold text-fut-rare hidden md:block"></span>
                <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-red-900 px-3 py-1 rounded-lg transition">로그아웃</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-8 mt-4">
        <!-- 좌측: 카드 상세 -->
        <div class="lg:col-span-4 lg:sticky lg:top-24 space-y-6">
            <div class="glass p-6 rounded-3xl shadow-2xl relative overflow-hidden" id="cardDetailArea">
                <div class="flex justify-between items-center mb-6">
                    <span id="playerTier" class="text-[10px] font-bold px-2 py-1 rounded bg-slate-800 border border-white/20">ROOKIE</span>
                    <div class="font-oswald text-xl text-fut-rare">LV.<span id="playerLv">1</span></div>
                </div>
                
                <div id="mainFutCard" class="fut-card w-[280px] h-[420px] mx-auto p-6 flex flex-col shadow-2xl card-rookie">
                    <div class="flex justify-between h-32 z-10">
                        <div class="flex flex-col items-center">
                            <span id="playerOvr" class="font-oswald text-5xl font-bold drop-shadow-md">60</span>
                            <div class="flex flex-col items-center mt-1 group cursor-pointer" id="btnChangePos">
                                <span id="playerPos" class="font-bold text-sm">미정</span>
                                <i class="fa-solid fa-pen text-[8px] opacity-0 group-hover:opacity-100 transition"></i>
                            </div>
                            <img src="https://flagcdn.com/w40/kr.png" class="w-6 mt-3 shadow-sm">
                        </div>
                        <div class="relative flex-grow flex justify-center items-center">
                            <span id="playerAvatar" class="text-8xl drop-shadow-lg">👦</span>
                            <div class="item-slot" style="top:-8px; left:50%; transform:translateX(-50%)" id="slot_head"></div>
                            <div class="item-slot" style="top:40px; left:10px" id="slot_handL"></div>
                            <div class="item-slot" style="top:40px; right:10px" id="slot_handR"></div>
                            <div class="item-slot" style="bottom:5px; left:30px" id="slot_footL"></div>
                            <div class="item-slot" style="bottom:5px; right:30px" id="slot_footR"></div>
                        </div>
                    </div>
                    
                    <div class="text-center mt-4 z-10">
                        <div id="playerName" class="font-display text-2xl uppercase tracking-widest drop-shadow-md">선수명</div>
                        <div class="w-full h-[1px] bg-white/30 my-2"></div>
                        
                        <div class="relative flex justify-center py-2">
                            <canvas id="statRadar" width="140" height="140" class="opacity-80"></canvas>
                            <div id="statsGrid" class="absolute inset-0 grid grid-cols-3 gap-y-8 gap-x-2 text-[10px] font-bold"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 px-2">
                    <div class="flex justify-between text-[10px] font-bold mb-1 text-slate-400">
                        <span>EXP</span> <span id="expText">0 / 100</span>
                    </div>
                    <div class="w-full bg-black/40 h-2 rounded-full overflow-hidden border border-white/10">
                        <div id="expBar" class="bg-gradient-to-r from-emerald-500 to-fut-rare h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>

                <div class="mt-6 flex justify-between items-center bg-black/40 p-4 rounded-2xl border border-white/5">
                    <span class="text-xs font-bold text-slate-400">보유 자산</span>
                    <span class="font-oswald text-2xl text-fut-gold"><span id="playerBong">0</span> B</span>
                </div>

                <!-- 기록 입력 패널 -->
                <div id="recordPanel" class="mt-6 grid grid-cols-2 gap-2 hidden">
                    <button onclick="window.addActivity('matches')" class="bg-slate-800 py-2.5 rounded-xl text-[10px] font-bold hover:bg-slate-700 transition">출전 (+50)</button>
                    <button onclick="window.addActivity('training')" class="bg-emerald-900/40 py-2.5 rounded-xl text-[10px] font-bold text-emerald-400 hover:bg-emerald-800 transition">훈련 (+30)</button>
                    <button onclick="window.addActivity('goals')" class="bg-yellow-900/40 py-2.5 rounded-xl text-[10px] font-bold text-yellow-400 hover:bg-yellow-800 transition">골 (+20)</button>
                    <button onclick="window.addActivity('assists')" class="bg-blue-900/40 py-2.5 rounded-xl text-[10px] font-bold text-blue-400 hover:bg-blue-800 transition">도움 (+10)</button>
                </div>
                
                <button id="btnClaimWage" onclick="window.claimWage()" class="w-full mt-4 bg-fut-gold text-black font-bold py-3.5 rounded-xl transition shadow-lg hidden">💰 주급 받기</button>
            </div>
        </div>

        <!-- 우측: 메인 영역 -->
        <div class="lg:col-span-8 space-y-8">
            <!-- 라커룸 -->
            <div id="tab_locker" class="tab-content space-y-8">
                <div class="glass p-6 rounded-3xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-display text-2xl text-white">라커룸 명단</h3>
                        <div id="adminAttendance" class="hidden gap-2">
                            <button onclick="window.saveAttendance()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-500">출석 저장</button>
                        </div>
                    </div>
                    <div id="lockerGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4"></div>
                </div>

                <div class="glass p-6 rounded-3xl border-t-4 border-emerald-500">
                    <h3 class="font-display text-2xl text-white mb-4">AI 황금 밸런스 팀 메이커</h3>
                    <div class="bg-black/20 p-5 rounded-2xl flex flex-col md:flex-row items-center gap-6">
                        <div class="text-center md:text-left">
                            <div class="text-xs text-slate-400 font-bold mb-1 uppercase">Selection</div>
                            <div class="text-2xl font-oswald text-fut-rare"><span id="checkCount">0</span>명</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-bold">팀 수:</span>
                            <div class="flex items-center bg-slate-800 rounded-lg overflow-hidden border border-slate-600">
                                <button onclick="window.adjTeamCount(-1)" class="px-3 py-2 hover:bg-slate-700">-</button>
                                <span id="teamCountDisplay" class="px-4 py-2 font-oswald text-lg">2</span>
                                <button onclick="window.adjTeamCount(1)" class="px-3 py-2 hover:bg-slate-700">+</button>
                            </div>
                        </div>
                        <button onclick="window.makeTeams()" class="flex-grow bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold shadow-xl">팀 나누기 실행</button>
                    </div>
                    <div id="teamResult" class="grid sm:grid-cols-2 gap-4 mt-8"></div>
                </div>
            </div>

            <!-- 상점/강화 -->
            <div id="tab_shop" class="tab-content hidden space-y-6">
                <div class="glass p-6 rounded-3xl">
                    <h3 class="font-display text-2xl text-purple-400 mb-6"><i class="fa-solid fa-hammer"></i> 장비 상점 & 강화소</h3>
                    <div id="shopGrid" class="grid md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- 랭킹 -->
            <div id="tab_rank" class="tab-content hidden">
                <div class="glass p-6 rounded-3xl">
                    <h3 class="font-display text-2xl text-white mb-6 text-center">🏆 명예의 전당 (Top 10)</h3>
                    <div id="rankList" class="space-y-3"></div>
                </div>
            </div>

            <!-- 관리자 -->
            <div id="tab_admin" class="tab-content hidden">
                <div class="glass p-6 rounded-3xl">
                    <h3 class="font-display text-2xl text-emerald-400 mb-6">마스터 통제 패널</h3>
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <button onclick="window.massGive('exp', 50)" class="bg-slate-800 p-4 rounded-2xl border border-emerald-500/30 text-xs font-bold">전체 경험치 +50</button>
                        <button onclick="window.massGive('bong', 10)" class="bg-slate-800 p-4 rounded-2xl border-fut-gold/30 text-xs font-bold text-fut-gold">전체 자산 +10B</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-center border-collapse">
                            <thead><tr class="bg-black/40 text-slate-400"><th class="p-3">이름</th><th class="p-3">OVR</th><th class="p-3">LV</th><th class="p-3">BONG</th><th class="p-3">작업</th></tr></thead>
                            <tbody id="masterTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sambong-futsal-ultimate';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ALLOWED_PLAYERS = ['김단엘', '김다래', '김라희', '김민지', '김사랑비', '김지훈', '노승희', '박소담', '박소윤', '박준수', '박하율', '박현수', '백시율', '석서영', '이가온', '이동해', '이시형', '이예주', '이준용', '이지안', '인시진', '임은영', '정의영', '정의정', '조이담', '최윤희', '함인솔', '황주하', '황훈태', '황혜민', '황혜윤'];
        const STAT_KEYS = ['pac', 'sho', 'pas', 'dri', 'def', 'phy', 'ref', 'int', 'pst', 'dis', 'cmp', 'wrk'];
        const SHOP_ITEMS = [
            { id: 'h1', name: '시야 확장 고글', type: 'head', price: 100, stats: {pst:1}, grow: {pst:15}, icon: '🥽' },
            { id: 'f1', name: '스피드 스타 슈즈', type: 'footL', price: 150, stats: {pac:1}, grow: {pac:20}, icon: '👟' },
            { id: 'f2', name: '캐논 슈터 슈즈', type: 'footR', price: 150, stats: {sho:1}, grow: {sho:20}, icon: '🥾' },
            { id: 'g1', name: '라텍스 그립 장갑', type: 'handL', price: 120, stats: {ref:1}, grow: {ref:15}, icon: '🧤' }
        ];

        let state = { user: null, players: [], selectedId: null, checkedIds: new Set(), loginId: null, isGM: false, teamCount: 2 };

        const showLoading = (show) => document.getElementById('globalLoading').classList.toggle('hidden', !show);
        const toast = (msg) => { alert(msg); };
        const getSafeId = (name) => name.replace(/[^가-힣a-zA-Z0-9]/g, '');

        // 로직 함수들
        const getBonus = (p) => {
            let flat = {}, grow = {};
            if(!p) return { flat, grow };
            ['head', 'handL', 'handR', 'footL', 'footR'].forEach(type => {
                const itemId = p[`equip_${type}`];
                if(itemId) {
                    const item = SHOP_ITEMS.find(i => i.id === itemId);
                    if(item) {
                        const lv = (p.itemLvs && p.itemLvs[itemId]) || 0;
                        Object.entries(item.stats).forEach(([k, v]) => flat[k] = (flat[k] || 0) + v + lv);
                        Object.entries(item.grow).forEach(([k, v]) => grow[k] = (grow[k] || 0) + v + (lv * 10));
                    }
                }
            });
            return { flat, grow };
        };

        const getOvr = (p) => {
            if(!p) return 60;
            const b = getBonus(p);
            const sum = STAT_KEYS.reduce((acc, k) => acc + (Number(p[k]) || 60) + (b.flat[k] || 0), 0);
            return Math.floor(sum / 12);
        };

        const getTier = (ovr) => {
            if(ovr < 70) return { name: 'ROOKIE', class: 'card-rookie' };
            if(ovr < 80) return { name: 'SEMIPRO', class: 'card-semipro' };
            if(ovr < 90) return { name: 'PRO', class: 'card-pro' };
            if(ovr < 100) return { name: 'WORLDCLASS', class: 'card-worldclass' };
            return { name: 'CHALLENGER', class: 'card-challenger' };
        };

        const drawRadar = (p, bFlat) => {
            const canvas = document.getElementById('statRadar');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const cx = 70, cy = 70, r = 50;
            ctx.clearRect(0,0,140,140);
            
            ctx.beginPath();
            for(let i=0; i<6; i++) {
                const angle = (Math.PI*2/6)*i - Math.PI/2;
                ctx.lineTo(cx + r*Math.cos(angle), cy + r*Math.sin(angle));
            }
            ctx.closePath(); ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.stroke();

            const radarKeys = ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];
            ctx.beginPath();
            radarKeys.forEach((k, i) => {
                const val = Math.min(100, (Number(p[k])||60) + (bFlat[k]||0)) / 100;
                const angle = (Math.PI*2/6)*i - Math.PI/2;
                ctx.lineTo(cx + (r*val)*Math.cos(angle), cy + (r*val)*Math.sin(angle));
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(56, 255, 142, 0.4)'; ctx.fill();
            ctx.strokeStyle = '#38ff8e'; ctx.lineWidth = 2; ctx.stroke();
        };

        // UI 렌더링
        window.renderAll = () => {
            renderLocker();
            renderRank();
            renderShop();
            if(state.selectedId) renderSelected();
            if(state.isGM) renderAdminTable();
        };

        const renderSelected = () => {
            const p = state.players.find(x => x.id === state.selectedId);
            if(!p) return;
            const ovr = getOvr(p); const tier = getTier(ovr); const b = getBonus(p);
            
            document.getElementById('playerName').innerText = p.name;
            document.getElementById('playerOvr').innerText = ovr;
            document.getElementById('playerPos').innerText = p.pos || '미정';
            document.getElementById('playerLv').innerText = p.level || 1;
            document.getElementById('playerBong').innerText = p.bong || 0;
            document.getElementById('playerTier').innerText = tier.name;
            document.getElementById('mainFutCard').className = `fut-card w-[280px] h-[420px] mx-auto p-6 flex flex-col shadow-2xl ${tier.class}`;
            
            const expNeed = 100 + (p.level * 10);
            document.getElementById('expText').innerText = `${p.exp} / ${expNeed}`;
            document.getElementById('expBar').style.width = `${Math.min(100, (p.exp / expNeed) * 100)}%`;

            let sHtml = '';
            STAT_KEYS.forEach(k => {
                const total = (Number(p[k]) || 60) + (b.flat[k] || 0);
                sHtml += `<div class="flex flex-col items-center"><div>${total}</div><div class="text-[8px] opacity-60 uppercase">${k}</div></div>`;
            });
            document.getElementById('statsGrid').innerHTML = sHtml;
            drawRadar(p, b.flat);

            ['head', 'handL', 'handR', 'footL', 'footR'].forEach(type => {
                const slot = document.getElementById(`slot_${type}`);
                const itemId = p[`equip_${type}`];
                if(itemId) {
                    const it = SHOP_ITEMS.find(i => i.id === itemId);
                    const lv = (p.itemLvs && p.itemLvs[itemId]) || 0;
                    slot.innerHTML = `<span class="text-lg ${lv > 0 ? 'eff-glow' : ''}">${it ? it.icon : ''}</span>${lv > 0 ? `<span class="absolute -top-1 -right-1 text-[8px] bg-black px-1 rounded text-fut-gold">+${lv}</span>` : ''}`;
                    slot.classList.add('bg-emerald-500/50', 'border-fut-gold');
                } else {
                    slot.innerHTML = ''; slot.classList.remove('bg-emerald-500/50', 'border-fut-gold');
                }
            });

            const isMe = (state.loginId === p.id);
            document.getElementById('recordPanel').classList.toggle('hidden', !isMe);
            document.getElementById('btnClaimWage').classList.toggle('hidden', !isMe);
        };

        const renderLocker = () => {
            const grid = document.getElementById('lockerGrid'); if(!grid) return;
            grid.innerHTML = '';
            ALLOWED_PLAYERS.forEach(name => {
                const sid = getSafeId(name);
                const p = state.players.find(x => x.id === sid);
                const isSelected = state.selectedId === sid;
                const isChecked = state.checkedIds.has(sid);
                
                const div = document.createElement('div');
                div.className = `mini-card p-3 rounded-2xl cursor-pointer relative text-center glass ${p ? 'active' : ''} ${isSelected ? 'selected' : ''}`;
                div.onclick = () => window.selectPlayer(sid);
                
                if(p) {
                    div.innerHTML = `
                        <input type="checkbox" class="absolute top-2 left-2" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); window.toggleCheck('${sid}')">
                        <div class="text-3xl mb-1">👦</div>
                        <div class="font-bold text-xs text-white">${p.name}</div>
                        <div class="font-oswald text-fut-rare text-[10px]">${getOvr(p)} OVR</div>
                    `;
                } else {
                    div.innerHTML = `<div class="opacity-20 py-4 text-[10px]">${name}</div>`;
                }
                grid.appendChild(div);
            });
        };

        const renderRank = () => {
            const list = document.getElementById('rankList'); if(!list) return;
            const sorted = [...state.players].sort((a,b) => getOvr(b) - getOvr(a)).slice(0, 10);
            list.innerHTML = sorted.map((p, i) => `
                <div class="flex items-center justify-between bg-black/30 p-4 rounded-2xl border border-white/5 hover:border-fut-rare/30 transition cursor-pointer" onclick="window.selectPlayer('${p.id}')">
                    <div class="flex items-center gap-4">
                        <span class="font-oswald text-xl ${i<3 ? 'text-fut-gold' : 'text-slate-500'}">#${i+1}</span>
                        <span class="font-bold">${p.name}</span>
                    </div>
                    <div class="font-oswald text-fut-rare text-lg">${getOvr(p)}</div>
                </div>
            `).join('');
        };

        const renderShop = () => {
            const grid = document.getElementById('shopGrid'); if(!grid) return;
            const p = state.players.find(x => x.id === state.loginId);
            grid.innerHTML = SHOP_ITEMS.map(item => {
                const hasItem = p && p.inventory && p.inventory.includes(item.id);
                const lv = (p && p.itemLvs && p.itemLvs[item.id]) || 0;
                return `
                <div class="glass p-5 rounded-3xl border border-white/5">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-2xl">${item.icon}</div>
                        <div class="text-right">
                            <div class="font-bold text-white">${item.name}</div>
                            <div class="text-fut-gold font-oswald">${item.price} B</div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        ${!hasItem ? 
                            `<button onclick="window.buyItem('${item.id}')" class="flex-1 bg-emerald-600 py-2 rounded-xl text-xs font-bold">구매</button>` :
                            `<button onclick="window.equipItem('${item.id}', '${item.type}')" class="flex-1 bg-slate-700 py-2 rounded-xl text-xs font-bold">장착/해제</button>
                             <button onclick="window.enhanceItem('${item.id}')" class="flex-1 bg-purple-600 py-2 rounded-xl text-xs font-bold">강화 (+${lv})</button>`
                        }
                    </div>
                </div>`;
            }).join('');
        };

        const renderAdminTable = () => {
            const body = document.getElementById('masterTable'); if(!body) return;
            body.innerHTML = state.players.map(p => `
                <tr class="hover:bg-white/5 transition">
                    <td class="p-3 font-bold">${p.name}</td>
                    <td class="p-3 font-oswald text-fut-rare">${getOvr(p)}</td>
                    <td class="p-3">Lv.${p.level}</td>
                    <td class="p-3 text-fut-gold font-oswald">${p.bong}B</td>
                    <td class="p-3"><button onclick="window.selectPlayer('${p.id}')" class="bg-blue-900/50 text-blue-300 px-3 py-1 rounded-lg text-[10px] font-bold">관리</button></td>
                </tr>
            `).join('');
        };

        // 제어 로직
        window.setTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`tab_${id}`);
            if(target) target.classList.remove('hidden');
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(t => { if(t.getAttribute('onclick').includes(id)) t.classList.add('active'); });
        };

        window.adjTeamCount = (v) => { state.teamCount = Math.max(2, Math.min(6, state.teamCount + v)); document.getElementById('teamCountDisplay').innerText = state.teamCount; };
        
        window.toggleCheck = (id) => { 
            if(state.checkedIds.has(id)) state.checkedIds.delete(id); else state.checkedIds.add(id); 
            document.getElementById('checkCount').innerText = state.checkedIds.size; renderLocker(); 
        };

        window.handleLogin = async (id, pin) => {
            if(!id) return toast("권한을 선택하세요.");
            showLoading(true);
            try {
                let actualId = id;
                if(id === 'player') actualId = getSafeId(document.getElementById('loginName').value);
                if (!state.user) throw new Error("서버 인증 중입니다.");
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', actualId);
                const snap = await getDoc(docRef);
                if(snap.exists()) {
                    if(snap.data().pin && snap.data().pin !== pin) throw new Error("PIN 번호 불일치");
                } else if(actualId !== 'guest') {
                    const name = actualId === 'gm1' ? '마스터' : document.getElementById('loginName').value;
                    const initial = { name, pin, level: 1, exp: 0, bong: 50, inventory: [], itemLvs: {}, pos: '미정' };
                    STAT_KEYS.forEach(k => initial[k] = 60);
                    await setDoc(docRef, initial);
                }
                state.loginId = actualId; state.isGM = actualId === 'gm1';
                document.getElementById('loginOverlay').classList.add('opacity-0', 'pointer-events-none');
                if(state.isGM) document.getElementById('adminTab').classList.remove('hidden');
                document.getElementById('navInfo').innerText = `${state.isGM ? 'MASTER' : (actualId === 'guest' ? 'GUEST' : 'PLAYER: ' + actualId)}`;
                window.selectPlayer(actualId === 'guest' ? getSafeId(ALLOWED_PLAYERS[0]) : actualId);
            } catch(e) { toast(e.message); } finally { showLoading(false); }
        };

        window.addActivity = async (type) => {
            if(!state.loginId || state.loginId === 'guest' || !state.user) return;
            const p = state.players.find(x => x.id === state.loginId);
            const expMap = { matches: 50, training: 30, goals: 20, assists: 10 };
            const expGained = expMap[type];
            let newExp = (p.exp || 0) + expGained;
            let newLv = p.level || 1;
            const need = 100 + (newLv * 10);
            let updates = { exp: newExp };
            if(newExp >= need) {
                updates.exp = newExp - need;
                updates.level = newLv + 1;
                const b = getBonus(p);
                STAT_KEYS.forEach(k => {
                    const chance = 15 + (b.grow[k] || 0);
                    if(Math.random() * 100 < chance) updates[k] = (Number(p[k])||60) + 1;
                });
                toast("🎉 LEVEL UP!");
            }
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', state.loginId), updates, { merge: true });
        };

        window.buyItem = async (itemId) => {
            const p = state.players.find(x => x.id === state.loginId);
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if(p.bong < item.price) return toast("잔액 부족!");
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', state.loginId), {
                bong: p.bong - item.price, inventory: [...(p.inventory || []), itemId]
            }, { merge: true });
            toast("구매 완료!");
        };

        window.enhanceItem = async (itemId) => {
            const p = state.players.find(x => x.id === state.loginId);
            const curLv = (p.itemLvs && p.itemLvs[itemId]) || 0;
            const cost = 50 + (curLv * 30);
            if(p.bong < cost) return toast("잔액 부족!");
            const success = Math.random() < (0.7 - curLv*0.1);
            let newLvs = {...(p.itemLvs || {})};
            if(success) { newLvs[itemId] = curLv + 1; toast("✨ 성공!"); } 
            else { newLvs[itemId] = Math.max(0, curLv - 1); toast("💥 실패..."); }
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', state.loginId), {
                bong: p.bong - cost, itemLvs: newLvs
            }, { merge: true });
        };

        window.equipItem = async (itemId, type) => {
            const p = state.players.find(x => x.id === state.loginId);
            const field = `equip_${type}`;
            const newVal = p[field] === itemId ? null : itemId;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'players', state.loginId), { [field]: newVal }, { merge: true });
        };

        window.makeTeams = () => {
            const pool = Array.from(state.checkedIds).map(id => state.players.find(x => x.id === id)).filter(Boolean).sort((a,b) => getOvr(b) - getOvr(a));
            if(pool.length < state.teamCount) return toast("인원 부족");
            let teams = Array.from({length: state.teamCount}, () => []);
            pool.forEach((p, i) => { const tidx = Math.floor(i/state.teamCount)%2===0 ? (i%state.teamCount) : (state.teamCount-1-(i%state.teamCount)); teams[tidx].push(p); });
            document.getElementById('teamResult').innerHTML = teams.map((t, i) => `
                <div class="glass p-5 rounded-2xl border-l-4 border-emerald-500">
                    <h4 class="font-display text-white mb-2">TEAM ${i+1}</h4>
                    <ul class="text-xs space-y-1">${t.map(p => `<li>${p.name} (${getOvr(p)})</li>`).join('')}</ul>
                </div>`).join('');
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.7 } });
        };

        window.massGive = async (type, amount) => {
            if(!state.isGM || !state.user) return;
            if(!confirm(`전체 지급하시겠습니까?`)) return;
            showLoading(true);
            try {
                const batch = writeBatch(db);
                state.players.forEach(p => {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'players', p.id);
                    if(type === 'bong') batch.update(ref, { bong: (Number(p.bong) || 0) + amount });
                    else if(type === 'exp') batch.update(ref, { exp: (Number(p.exp) || 0) + amount });
                });
                await batch.commit(); toast("완료!");
            } catch(e) { toast("실패: " + e.message); } finally { showLoading(false); }
        };

        window.selectPlayer = (id) => { state.selectedId = id; window.renderAll(); };

        // INITIALIZE
        const init = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if(user) {
                        state.user = user;
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'players'), (snap) => {
                            state.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            window.renderAll();
                        });
                    }
                });
                const nameSel = document.getElementById('loginName');
                ALLOWED_PLAYERS.forEach(n => nameSel.innerHTML += `<option value="${n}">${n}</option>`);
            } catch(e) { toast("초기화 실패"); }
        };
        init();

        document.getElementById('btnLogin').onclick = () => window.handleLogin(document.getElementById('loginId').value, document.getElementById('loginPin').value);
        document.getElementById('loginId').onchange = (e) => document.getElementById('playerNameContainer').classList.toggle('hidden', e.target.value !== 'player');
    </script>
</body>
</html>
